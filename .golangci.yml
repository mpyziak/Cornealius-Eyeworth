version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocognit
    - gocritic
    - gosec
    - nakedret
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unparam
  settings:
    gocognit:
      min-complexity: 35 # 20 permanently reds 4 reflect/Fyne-wiring functions
    exhaustive:
      default-signifies-exhaustive: true
    staticcheck:
      # ST10xx is doc-comment style, which revive.exported would cover if enabled
      checks: ["all", "-ST1000", "-ST1003", "-ST1020", "-ST1021", "-ST1022"]
    revive:
      rules:
        - name: var-naming
        - name: indent-error-flow
        - name: early-return
        - name: superfluous-else
        - name: unreachable-code
        - name: range-val-in-closure
        # - name: exported   # 78 missing-doc-comment findings; needs its own pass
    errcheck:
      exclude-functions:
        # Win32: the Errno is meaningless unless the primary return failed
        - (*syscall.LazyProc).Call
        - syscall.RegCloseKey
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, forcetypeassert]
      - path: (sysmon_windows|systraypatch_win|notifier_windows)\.go
        linters: [gosec] # G103 on every unsafe use in Win32 callback code
      - path: notifications/helpers\.go
        text: "G404" # quip picker, not a CSPRNG use
      - path: sysmon_windows\.go
        text: "unsafeptr" # Win32 WndProc lParam; see Makefile's check-windows
      - path: dev-diagnostics/diagnostics\.go
        text: "G304" # rotating log filename: fixed app log dir + an internally generated timestamp, never external input

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/mpyziak/cornealius-eyeworth]
