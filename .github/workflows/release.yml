name: Release

# Job graph:
#
#   plan ─┬─ test-windows ── build-windows ────────┐
#         │                                        │
#         ├─ test-unix ───── build-unix (matrix) ──┼─ vulncheck ── release
#         │                  linux-* and macos-*   │               (tags only)
#         │                  run in parallel       │
#         └─ checks (vet, lint) ───────────────────┘
#
# Tests gate builds rather than sharing a job with them, split by build
# constraint family: notifier_windows.go and systraypatch_win.go compile only on
# Windows, their counterparts only off it. One run per family covers both paths.
#
# Builds upload artifacts on every push, so rc branches produce downloadable
# archives. Only the release job is tag-gated.
#
# Every build target is individually switchable - see BUILD TOGGLES in the plan
# job, which is the only place any of this is configured.

on:
  push:
    # Dry runs without throwaway tags. Drop once the pipeline is proven.
    branches: [rc*]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Windows runners default to pwsh. Every run block here is bash - mkdir -p,
    # $VAR expansion, backslash continuations - so pin it once for all jobs.
    # Composite action steps set their own shell.
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.github.mpyziak.cornealius-eyeworth
  APP_NAME: Cornealius Eyeworth
  # Unversioned on purpose: shortcuts, autostart entries and firewall rules
  # survive an update. The version goes on the archive.
  APP_FILE: Cornealius-Eyeworth
  ICON: assets/Logo.png
  # Must match the fyne.io/fyne/v2 version in go.mod and the Makefile.
  FYNE_TAG: v2.7.4

jobs:
  plan:
    name: Plan build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cfg.outputs.version }}
      label: ${{ steps.cfg.outputs.label }}
      windows: ${{ steps.cfg.outputs.windows }}
      unix_matrix: ${{ steps.cfg.outputs.unix_matrix }}
      unix_any: ${{ steps.cfg.outputs.unix_any }}
      vulncheck_blocking: ${{ steps.cfg.outputs.vulncheck_blocking }}
    steps:
      - name: Configure
        id: cfg
        run: |
          # ══ BUILD TOGGLES ═══════════════════════════════════════════════
          # Flip any of these to true/false. Tests are deliberately not
          # switchable: they are cheap, and they are the only coverage of the
          # windows / non-windows code split.

          BUILD_WINDOWS_AMD64=true
          BUILD_LINUX_AMD64=true
          BUILD_LINUX_ARM64=true
          # Apple Silicon. Bills at 10x the Linux rate on a private repo.
          BUILD_MACOS_ARM64=false
          # Intel. macos-15-intel is the last x86_64 image Actions offers and
          # retires in August 2027. Nobody here has an Intel Mac to verify on.
          BUILD_MACOS_AMD64=false

          # true  - a govulncheck finding fails the job and blocks the release
          # false - it is reported in the log and the release proceeds
          VULNCHECK_BLOCKING=true
          # ════════════════════════════════════════════════════════════════

          # Windows is its own job: different test gate, different packaging.
          echo "windows=$BUILD_WINDOWS_AMD64" >> "$GITHUB_OUTPUT"
          echo "vulncheck_blocking=$VULNCHECK_BLOCKING" >> "$GITHUB_OUTPUT"

          # Everything non-Windows shares one matrix. "platform" picks the
          # packaging branch, "suffix" names the archive and must stay unique -
          # upload-artifact rejects duplicate artifact names.
          entries=""
          add() { entries="${entries:+$entries,}$1"; }

          if [ "$BUILD_LINUX_AMD64" = true ]; then
            add '{"os":"ubuntu-latest","platform":"linux","suffix":"linux-amd64"}'
          fi
          if [ "$BUILD_LINUX_ARM64" = true ]; then
            # No "-arm" alias for ubuntu-latest exists, so this pins a version
            # and has to be bumped by hand.
            add '{"os":"ubuntu-24.04-arm","platform":"linux","suffix":"linux-arm64"}'
          fi
          if [ "$BUILD_MACOS_ARM64" = true ]; then
            add '{"os":"macos-latest","platform":"darwin","suffix":"macos-arm64"}'
          fi
          if [ "$BUILD_MACOS_AMD64" = true ]; then
            add '{"os":"macos-15-intel","platform":"darwin","suffix":"macos-amd64"}'
          fi

          # An empty include list is a hard error in Actions, so the build-unix
          # job is skipped entirely rather than handed one.
          if [ -n "$entries" ]; then unix_any=true; else unix_any=false; fi
          echo "unix_any=$unix_any" >> "$GITHUB_OUTPUT"
          echo "unix_matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"

          # Tag builds are versioned from the tag; branch builds get a short SHA
          # label and a placeholder version, since fyne requires x[.y[.z]].
          if [ "$GITHUB_REF" != "${GITHUB_REF#refs/tags/}" ]; then
            label="${GITHUB_REF#refs/tags/}"
            version="$(printf '%s' "${label#v}" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)"
          else
            label="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            version=""
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "version=${version:-0.0.0}" >> "$GITHUB_OUTPUT"

          echo "windows=$BUILD_WINDOWS_AMD64  unix=[$entries]  vulncheck_blocking=$VULNCHECK_BLOCKING"

  # ── Tests: one run per build-constraint family ─────────────────────────────

  test-windows:
    name: Test windows
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
        with:
          fyne-tag: ${{ env.FYNE_TAG }}

      - name: go test
        env:
          # -race needs cgo. Set explicitly because the Windows runner defaults
          # to 0 whenever gcc is not found on PATH.
          CGO_ENABLED: '1'
        run: |
          # -shuffle=on catches order dependencies, which this suite is exposed
          # to because the i18n tests share package-level state (Locales,
          # Active). -count=1 because setup-go restores the build cache between
          # runs, and a cached PASS would otherwise hide a regression.
          #
          # _external-patches/ is skipped by "./..." on every platform thanks to
          # the leading underscore, so this is safe on the Windows runner where
          # that file would otherwise compile and fail on an internal import.
          go test -race -shuffle=on -count=1 ./...

  test-unix:
    name: Test non-windows
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
        with:
          fyne-tag: ${{ env.FYNE_TAG }}

      - name: go test
        env:
          CGO_ENABLED: '1'
        run: go test -race -shuffle=on -count=1 ./...

  checks:
    name: Vet, lint
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
        with:
          fyne-tag: ${{ env.FYNE_TAG }}

      - name: go vet
        run: |
          go vet ./...
          go vet -tags "diagnostics sysmon" ./...
          GOOS=windows go vet -tags "diagnostics sysmon" -unsafeptr=false \
            ./dev-diagnostics ./notifications ./systray

      - name: gofmt
        run: gofmt -l . | (! grep .)

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          golangci-lint run
          golangci-lint run --build-tags "diagnostics,sysmon"
          GOOS=windows golangci-lint run --build-tags "diagnostics,sysmon" \
            ./notifications/... ./systray/... ./dev-diagnostics/...

  # ── Builds: gated on the tests for their constraint family ─────────────────

  build-windows:
    name: Build windows-amd64
    needs: [plan, test-windows]
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    env:
      ASSET: Cornealius-Eyeworth-${{ needs.plan.outputs.label }}-windows-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
        with:
          fyne-tag: ${{ env.FYNE_TAG }}

      - name: Package
        env:
          CGO_ENABLED: '1'
        run: |
          # go build, not fyne package: rsrc_windows_amd64.syso already has the
          # icon and manifest, and fyne would add a second manifest that
          # lld-link rejects. See RELEASES.md.
          mkdir -p dist staging
          go build -ldflags "-s -w -H windowsgui" -o "staging/$APP_FILE.exe" .
          # Compress-Archive rather than zip, which the Windows runner lacks.
          powershell -NoProfile -Command \
            "Compress-Archive -Path 'staging/$APP_FILE.exe' -DestinationPath 'dist/$ASSET.zip' -Force"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: dist/*
          if-no-files-found: error
          # Short retention keeps private-repo runs clear of the 500 MB cap.
          retention-days: 7

  build-unix:
    name: Build ${{ matrix.suffix }}
    needs: [plan, test-unix]
    if: needs.plan.outputs.unix_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unix_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ASSET: Cornealius-Eyeworth-${{ needs.plan.outputs.label }}-${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
        with:
          fyne-tag: ${{ env.FYNE_TAG }}

      - name: Install fyne CLI
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          fyne package --os "${{ matrix.platform }}" --app-id "$APP_ID" \
            --app-version "$VERSION" --icon "$ICON" --name "$APP_NAME"

          case "${{ matrix.platform }}" in
            linux)
              mv "$APP_NAME.tar.xz" "dist/$ASSET.tar.xz"
              ;;
            darwin)
              # Ad-hoc signature (-s -, no certificate). Apple Silicon refuses
              # to execute an arm64 binary without a valid signature, and
              # stripping after link invalidates the one Go applies. This does
              # not satisfy Gatekeeper - users still see the unverified-developer
              # dialog the README covers - it only makes the binary runnable.
              codesign --force -s - "$APP_NAME.app"
              # Fail here rather than on a Mac: verification time is scarcer
              # than runner minutes.
              codesign -v --verbose=2 "$APP_NAME.app"
              ditto -c -k --keepParent "$APP_NAME.app" "dist/$ASSET.zip"
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ── Join ───────────────────────────────────────────────────────────────────

  vulncheck:
    name: Vulnerability check
    needs: [plan, build-windows, build-unix, checks]
    # Any build job is skippable via its toggle, and a skipped dependency would
    # normally skip this job too. Run unless something actually failed.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-setup
        with:
          fyne-tag: ${{ env.FYNE_TAG }}

      - name: govulncheck
        # Advisory mode when the toggle is off: the finding is still printed and
        # the step is marked failed in the UI, but the job succeeds so the
        # release is not blocked.
        continue-on-error: ${{ needs.plan.outputs.vulncheck_blocking != 'true' }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          govulncheck ./...

  release:
    name: Release package
    # No permissive guard here on purpose: default job semantics require every
    # dependency to have succeeded, so a skipped vulncheck skips this too.
    needs: [plan, vulncheck]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ needs.plan.outputs.label }}" dist/* --generate-notes
