name: Release

on:
  push:
    # Dry runs without throwaway tags. Drop once the pipeline is proven.
    branches: [rc*]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.github.mpyziak.cornealius-eyeworth
  APP_NAME: Cornealius Eyeworth
  # Unversioned on purpose: shortcuts, autostart entries and firewall rules
  # survive an update. The version goes on the archive.
  APP_FILE: Cornealius-Eyeworth
  ICON: assets/Logo.png
  # Must match the fyne.io/fyne/v2 version in go.mod - the patched fork is
  # rebuilt from this tag on every run.
  FYNE_TAG: v2.7.4

jobs:
  plan:
    name: Plan build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - name: Select target platforms
        id: targets
        run: |
          # "platform" picks the build branch below, "suffix" names the archive.
          # Keeping them apart is what lets both Linux entries reuse one apt step
          # and one packaging branch. Suffixes must stay unique - upload-artifact
          # rejects duplicate names. No "-arm" alias for ubuntu-latest exists, so
          # that runner pins a version and has to be bumped by hand.
          linux_amd64='{"os":"ubuntu-latest","platform":"linux","suffix":"linux-amd64"}'
          linux_arm64='{"os":"ubuntu-24.04-arm","platform":"linux","suffix":"linux-arm64"}'
          windows='{"os":"windows-latest","platform":"windows","suffix":"windows-amd64"}'
          darwin='{"os":"macos-latest","platform":"darwin","suffix":"macos-arm64"}'

          # ── ONE-OFF: Intel macOS ──────────────────────────────────────────
          # Delete this entry and its use below once that release is out.
          # It shares platform "darwin", so it reuses the existing packaging
          # branch and just builds natively on an Intel runner.
          # macos-13 was retired in December 2025; macos-15-intel replaces it and
          # is the last x86_64 image Actions will offer, available until August
          # 2027. Doubles the macOS cost of a tag build - two jobs at 10x.
          darwin_amd64='{"os":"macos-15-intel","platform":"darwin","suffix":"macos-amd64"}'
          # ──────────────────────────────────────────────────────────────────

          # macOS on tags only: 10x the Linux rate on a private repo, and a dry
          # run proves nothing the tag build will not. Drop the condition once
          # the repo is public and runners are unmetered.
          if [ "$GITHUB_REF" != "${GITHUB_REF#refs/tags/}" ]; then
            echo "matrix={\"include\":[$linux_amd64,$linux_arm64,$windows,$darwin,$darwin_amd64]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$linux_amd64,$linux_arm64,$windows]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive version
        id: version
        run: |
          # Tag builds are versioned from the tag; branch builds get a short SHA
          # label and a placeholder version, since fyne requires x[.y[.z]].
          if [ "$GITHUB_REF" != "${GITHUB_REF#refs/tags/}" ]; then
            label="${GITHUB_REF#refs/tags/}"
            version="$(printf '%s' "${label#v}" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)"
          else
            label="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            version=""
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "version=${version:-0.0.0}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.suffix }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ASSET: Cornealius-Eyeworth-${{ needs.plan.outputs.label }}-${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Rebuild the patched Fyne fork
        run: |
          fork=../fyne-v2-watchtheme-patch

          # go.mod points at a sibling checkout no fresh clone has, so rebuild it
          # from pinned upstream plus our one patched file (LEAKS.md §1).
          #
          # init+fetch rather than clone: a clone cannot take a bare SHA, and
          # FYNE_TAG is meant to become one. autocrlf off so the check below is
          # not confused by line endings on the Windows runner.
          git init -q "$fork"
          git -C "$fork" config core.autocrlf false
          git -C "$fork" remote add origin https://github.com/fyne-io/fyne.git
          git -C "$fork" fetch -q --depth 1 origin "$FYNE_TAG"
          git -C "$fork" checkout -q --detach FETCH_HEAD

          cp external-patches/fyne-theme_windows.go \
            "$fork/internal/app/theme_windows.go"

          # Anything other than exactly that file means the patch missed, or
          # upstream is not the tree we expect. Either way, do not ship it.
          changed=$(git -C "$fork" status --porcelain)
          paths=$(printf '%s\n' "$changed" | awk 'NF {print $NF}')
          if [ "$paths" != "internal/app/theme_windows.go" ]; then
            echo "::error::Patched Fyne fork does not match expectations."
            echo "expected exactly: internal/app/theme_windows.go"
            echo "actual:"
            printf '%s\n' "$changed"
            exit 1
          fi
          echo "Fyne fork verified: patch applied, no other drift."

      - name: Install fyne CLI
        if: matrix.platform != 'windows'
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            windows)
              # go build, not fyne package: rsrc_windows_amd64.syso already has
              # the icon and manifest, and fyne would add a second manifest that
              # lld-link rejects. See RELEASES.md.
              mkdir -p staging
              go build -ldflags "-s -w -H windowsgui" -o "staging/$APP_FILE.exe" .
              # Compress-Archive rather than zip, which the Windows runner lacks.
              powershell -NoProfile -Command \
                "Compress-Archive -Path 'staging/$APP_FILE.exe' -DestinationPath 'dist/$ASSET.zip' -Force"
              ;;
            linux)
              fyne package --os linux --app-id "$APP_ID" \
                --app-version "$VERSION" --icon "$ICON" --name "$APP_NAME"
              mv "$APP_NAME.tar.xz" "dist/$ASSET.tar.xz"
              ;;
            darwin)
              fyne package --os darwin --app-id "$APP_ID" \
                --app-version "$VERSION" --icon "$ICON" --name "$APP_NAME"
              ditto -c -k --keepParent "$APP_NAME.app" "dist/$ASSET.zip"
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          # Short retention keeps private-repo runs clear of the 500 MB cap.
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ needs.plan.outputs.label }}" dist/* --generate-notes
